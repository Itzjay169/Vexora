; ============================================================================
; Vexora PgBouncer Production Connection Pool Configuration
; Blueprint Ref: Section 49 (PostgreSQL Connection Pooling: PgBouncer)
; ============================================================================

[databases]
vexora_prod = host=postgres-primary port=5432 dbname=vexora_prod auth_user=vexora_pooler
vexora_ro   = host=postgres-replica port=5432 dbname=vexora_prod auth_user=vexora_pooler

[pgbouncer]
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

; Network settings
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Pool configuration
pool_mode = transaction
max_client_conn = 5000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 15
reserve_pool_timeout = 5
max_db_connections = 100

; Timeouts & safety
server_reset_query = DISCARD ALL
server_check_delay = 30
server_check_query = SELECT 1
server_lifetime = 3600
server_idle_timeout = 600
client_idle_timeout = 0
query_wait_timeout = 15
query_timeout = 60
stats_users = vexora_admin, prometheus
